
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Tarefas</title>
</head>
<body>

    <h1>Gerenciador de Tarefas</h1>

    <input type="text" id="descricao"
           placeholder="Digite uma tarefa">

    <button onclick="adicionar()">Adicionar Tarefa</button>

    <h2>Minhas tarefas</h2>

    <ul id="lista"></ul>

    <h3 id="total">Total de tarefas: 0</h3>
    <h3 id="concluidas">Concluídas: 0</h3>
    <h3 id="pendentes">Pendentes: 0</h3>

    <script>
        let tarefas = [];

        function adicionar() {
            let descricao = document.getElementById("descricao").value;

            if (descricao === "") {
                alert("Digite uma tarefa!");
                return;
            }

            tarefas.push({
                descricao: descricao,
                concluida: false
            });

            document.getElementById("descricao").value = "";

            atualizarLista();
        }

        function atualizarLista() {
            let lista = document.getElementById("lista");
            lista.innerHTML = "";

            tarefas.forEach(function(tarefa, indice) {
                let item = document.createElement("li");

                let texto = document.createElement("span");

                texto.textContent = tarefa.descricao +
                    (tarefa.concluida ? " - Concluída" : " - Pendente");

                let botaoConcluir = document.createElement("button");
                botaoConcluir.textContent = "Concluir";

                botaoConcluir.onclick = function() {
                    tarefas[indice].concluida = true;
                    atualizarLista();
                };

                let botaoExcluir = document.createElement("button");
                botaoExcluir.textContent = "Excluir";

                botaoExcluir.onclick = function() {
                    tarefas.splice(indice, 1);
                    atualizarLista();
                };

                item.appendChild(texto);
                item.appendChild(botaoConcluir);
                item.appendChild(botaoExcluir);

                lista.appendChild(item);
            });

            let concluidas = tarefas.filter(function(tarefa) {
                return tarefa.concluida;
            }).length;

            let pendentes = tarefas.length - concluidas;

            document.getElementById("total").textContent =
                "Total de tarefas: " + tarefas.length;

            document.getElementById("concluidas").textContent =
                "Concluídas: " + concluidas;

            document.getElementById("pendentes").textContent =
                "Pendentes: " + pendentes;
        }
    </script>

</body>
</html>
