
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Controle de Estoque</title>
</head>
<body>

    <h1>Controle de Estoque</h1>

    <input type="text" id="nome" placeholder="Nome do produto">
    <input type="number" id="quantidade" placeholder="Quantidade">
    <input type="number" id="preco" placeholder="Preço" step="0.01">

    <button onclick="cadastrar()">Cadastrar Produto</button>

    <h2>Produtos cadastrados</h2>
    <ul id="lista"></ul>

    <h3 id="total">Valor total: R$ 0,00</h3>

    <script>
        let produtos = [];

        function cadastrar() {
            let nome = document.getElementById("nome").value;
            let quantidade = document.getElementById("quantidade").value;
            let preco = document.getElementById("preco").value;

            if (nome === "" || quantidade === "" || preco === "") {
                alert("Preencha todos os campos!");
                return;
            }

            quantidade = Number(quantidade);
            preco = Number(preco);

            if (quantidade <= 0 || preco < 0) {
                alert("Informe valores válidos!");
                return;
            }

            produtos.push({
                nome: nome,
                quantidade: quantidade,
                preco: preco
            });

            atualizarLista();

            document.getElementById("nome").value = "";
            document.getElementById("quantidade").value = "";
            document.getElementById("preco").value = "";
        }

        function atualizarLista() {
            let lista = document.getElementById("lista");
            lista.innerHTML = "";

            let total = 0;

            produtos.forEach(function(produto, indice) {
                let valor = produto.quantidade * produto.preco;
                total += valor;

                let item = document.createElement("li");

                item.textContent =
                    produto.nome +
                    " - Quantidade: " + produto.quantidade +
                    " - Preço: R$ " + produto.preco.toFixed(2) +
                    " - Total: R$ " + valor.toFixed(2) + " ";

                let botao = document.createElement("button");
                botao.textContent = "Excluir";

                botao.onclick = function() {
                    produtos.splice(indice, 1);
                    atualizarLista();
                };

                item.appendChild(botao);
                lista.appendChild(item);
            });

            document.getElementById("total").textContent =
                "Valor total do estoque: R$ " + total.toFixed(2);
        }
    </script>

</body>
</html>
