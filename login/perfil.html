<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
</head>
<body>
  <h1>Meu Perfil</h1>
  <p id="mensagem"></p>
  <a href="inicio.html">Voltar ao inicio</a>

  <script>
    let usuario = localStorage.getItem("usuario");
    if(usuario === null) {
      window.location.href = "login.html";
    }else{
      document.getElementById("mensagem").textContent = "Usuário logado: "+ usuario;
    }
  </script>
</body>
</html>
